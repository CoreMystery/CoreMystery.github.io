<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CS180 Portfolio</title>

    <link rel="stylesheet" href="style.css">

    <style>
        @import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;700&display=swap");

        :root {
            --page-bg-1: #f4f9ff;
            --page-bg-2: #eef3f8;
            --panel-bg: rgba(255, 255, 255, 0.88);
            --card-shadow: 0 20px 48px rgba(15, 23, 42, 0.1);
            --text: #1c2433;
            --muted: #59657d;
            --border: rgba(133, 156, 192, 0.25);
            --accent: #1157a7;
            --accent-2: #0e447f;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Manrope", "Segoe UI", Tahoma, sans-serif;
            background:
                radial-gradient(circle at 12% 0%, rgba(127, 197, 255, 0.28) 0%, rgba(127, 197, 255, 0) 48%),
                linear-gradient(180deg, var(--page-bg-1) 0%, var(--page-bg-2) 100%);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
        }

        header {
            width: min(100%, 1100px);
            margin: 0 auto;
            text-align: center;
            padding: clamp(44px, 7vw, 92px) clamp(16px, 3vw, 32px) 12px;
        }

        header h1 {
            margin: 0 0 12px;
            font-family: "Fraunces", Georgia, serif;
            font-size: clamp(2.2rem, 4.7vw, 3.8rem);
            letter-spacing: -0.04em;
            line-height: 1.1;
        }

        header p {
            margin: 0 auto;
            color: var(--muted);
            font-size: 1.06rem;
            max-width: 60ch;
        }

        main {
            width: min(100%, 1100px);
            margin: 0 auto;
            padding: 26px clamp(16px, 3vw, 32px) 86px;
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 22px;
        }

        .project-card {
            display: block;
            text-decoration: none;
            color: inherit;
            padding: 28px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--panel-bg);
            box-shadow: var(--card-shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .project-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 24px 52px rgba(15, 23, 42, 0.14);
        }

        .project-card h2 {
            margin: 0 0 8px;
            font-family: "Fraunces", Georgia, serif;
            font-size: 1.65rem;
            letter-spacing: -0.02em;
        }

        .project-card p {
            margin: 0;
            color: var(--muted);
        }

        @media (max-width: 700px) {
            header {
                padding-top: 36px;
            }

            main {
                padding-top: 16px;
            }

            .project-card {
                border-radius: 16px;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>CS180: Introduction to Computer Vision</h1>
        <p>Hanif's Project Portfolio</p>
    </header>

    <main>
        <section class="projects">
            <a class="project-card" href="./0/index.html">
                <h2>Project 0</h2>
                <p>Becoming Friends with Your Camera</p>
            </a>
        </section>
    </main>

</body>
</html>
